services:
  api:
    image: wastereporting-api-test
    build:
      context: .
      dockerfile: src/WasteReporting.API/Dockerfile
    ports:
      - '5001:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__DatabaseConnection=${DATABASE_CONNECTION:-}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-SuperSecretKey123!ForTestingOnly}
      - JwtSettings__Issuer=test
      - JwtSettings__Audience=test
      - JwtSettings__ExpirationMinutes=60

  bdd-tests:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    depends_on:
      - api
    volumes:
      - .:/app
    working_dir: /app/src/WasteReporting.BDDTests
    # Aguarda a API subir e executa os testes
    command: >
      bash -c "sleep 15 && dotnet test --verbosity normal"
    environment:
      - API_URL=http://api:8080
